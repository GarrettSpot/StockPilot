backend:
  image: ghcr.io/your-github-user/stockpilot-backend
  tag: latest
  replicas: 2
  containerPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

frontend:
  image: ghcr.io/your-github-user/stockpilot-frontend
  tag: latest
  replicas: 2
  containerPort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

postgres:
  image: postgres:16-alpine
  user: stockpilot
  password: stockpilot
  db: stockpilot
  storage: 1Gi

ingress:
  enabled: false
  className: nginx
  host: stockpilot.local

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

serviceMonitor:
  enabled: false
