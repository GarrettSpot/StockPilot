name: StockPilot CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  REGISTRY: ghcr.io
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Run backend tests
        run: pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        run: npm install && npm run build
        working-directory: frontend

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        run: |
          docker build -t ghcr.io/${{ env.OWNER_LC }}/stockpilot-backend:${{ github.sha }} ./backend
          docker build -t ghcr.io/${{ env.OWNER_LC }}/stockpilot-frontend:${{ github.sha }} ./frontend
      - name: Scan backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER_LC }}/stockpilot-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.OWNER_LC }}/stockpilot-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push images
        run: |
          docker push ghcr.io/${{ env.OWNER_LC }}/stockpilot-backend:${{ github.sha }}
          docker push ghcr.io/${{ env.OWNER_LC }}/stockpilot-frontend:${{ github.sha }}

  deploy:
    # Enable by setting repository variable ENABLE_DEPLOY=true once the EKS cluster
    # exists and the KUBE_CONFIG_DATA secret is configured.
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: azure/setup-helm@v4
      - name: Ensure AWS CLI (for the kubeconfig exec plugin)
        run: command -v aws >/dev/null 2>&1 || pip install awscli
      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
      - name: Deploy with Helm
        run: |
          helm upgrade --install stockpilot ./helm/stockpilot -n stockpilot --create-namespace \
            -f helm/stockpilot/values-dev.yaml \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }} \
            --set backend.image=ghcr.io/${{ env.OWNER_LC }}/stockpilot-backend \
            --set frontend.image=ghcr.io/${{ env.OWNER_LC }}/stockpilot-frontend
          kubectl -n stockpilot rollout status deployment/backend --timeout=180s
          kubectl -n stockpilot rollout status deployment/frontend --timeout=120s
