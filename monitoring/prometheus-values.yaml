grafana:
  enabled: true
  adminPassword: admin
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 7d

alertmanager:
  enabled: false
