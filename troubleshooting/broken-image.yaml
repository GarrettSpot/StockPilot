# Deliberately broken: image tag does not exist, so the Pod stays in ImagePullBackOff.
# Investigate with: kubectl get pods / kubectl describe pod <name>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image
  namespace: stockpilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-image
  template:
    metadata:
      labels:
        app: broken-image
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-github-user/stockpilot-backend:does-not-exist
          ports:
            - containerPort: 8000
